<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration Form</title>
    </head>
    <body>
        <p>{{ msg }}</p>
        <div class="centered">
            <form action="/submit" method="POST">
                <table>
                    <tr>
                        <td><label for="username">Name:</label></td>
                        <td><input type="text" id="username" name="username" placeholder="Enter Your Name" required></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input type="email" id="email" name="email" placeholder="Enter Your Email" required></td>
                    </tr>
                    <tr>
                        <td><label for="age">Age:</label></td>
                        <td><input type="text" id="age" name="age" placeholder="Enter Your Age" required></td>
                    </tr>                    
                    <tr>
                        <td colspan="2" style="text-align: center;">
                            <input type="submit" value="Submit">
                            <a href="/view" target="_blank">View Data</a>
                        </td>
                    </tr>
                </table>

                <br><br>

    </body>
